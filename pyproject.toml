# Product-repo template: the offline engine package (ADR-0057). Rename `chronoscopelab` -> `<slug>lab` per product.
# Product pipeline dependencies and version metadata are maintained with the corresponding design records.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoscopelab"
# PEP 440 form of the display version X.XX.XXX (see CHANGELOG.md + chronoscopelab.__version__).
version = "0.22.1"
description = "ChronoScope: time-series forecasting method atlas (classical to foundation models). Offline data-pipeline + two data contracts + staged pipeline; classical + statistical (statsforecast) + ML (LightGBM) + zero-shot foundation (Chronos) ladder scored by preqts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Santibáñez-Leal" }]
dependencies = ["numpy==2.4.6"]

[tool.setuptools.packages.find]
where = ["data-pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E741 is ignored for short mathematical variable names used in scientific code.
ignore = ["E741"]
