# Product-specific path tooling. Numerical methods come from published dependencies.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E741 is ignored for short mathematical variable names used in scientific code.
ignore = ["E741"]
